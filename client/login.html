<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <title>로그인</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="shortcut icon" href="./assets/favicon.svg" type="image/x-icon" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <script src="./main.js" type="module"></script>
  </head>
  <body>
        <my-element name="tiger"> </my-element>
    
    <div class="auth">
      <h2>User List</h2>

      <div class="auth-tab">
        <button class="auth-tab-button is-active" data-mode="login">로그인</button>
        <button class="auth-tab-button" data-mode="signup">회원가입</button>
      </div>

      <form class="auth-form login-form">
        <div>
          <label for="loginEmail">email : </label>
          <input type="email" id="loginEmail" required />
        </div>

        <div>
          <label for="loginPassword">password : </label>
          <input type="password" id="loginPassword" required />
        </div>

        <button type="submit">로그인</button>
      </form>

      <form class="auth-form signup-form" hidden>
        <div>
          <label for="signupName">name : </label>
          <input type="text" id="signupName" required />
        </div>

        <div>
          <label for="signupEmail">email : </label>
          <input type="email" id="signupEmail" required />
        </div>

        <div>
          <label for="signupSite">website : </label>
          <input type="text" id="signupSite" required />
        </div>

        <div>
          <label for="signupPassword">password : </label>
          <input type="password" id="signupPassword" required />
        </div>

        <button type="submit">회원가입</button>
      </form>

      <p class="auth-message" role="status"></p>

      <p class="auth-warning">
        ⚠️ 학습용 가짜 로그인입니다. 비밀번호가 그대로 저장되고 누구나 조회할 수 있습니다.
      </p>
    </div>
  </body>
</html>
